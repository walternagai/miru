    - id: "B-i18n"
      code_does: "copy/delete/pull/compare forçam set_language('en_US'); strings hardcoded em inglês"
      check_expects: "Testes esperam pt-BR"
      spec_says: "i18n.py: SUPPORTED_LANGUAGES; README documenta MIRU_LANG"
      resolution: "Removido set_language forçado; strings substituídas por t() com chaves novas adicionadas em i18n.py (error.model_exists, error.file_empty, error.system_both, error.compare_file_audio, confirm.delete, confirm.cancelled) nos 3 idiomas."
