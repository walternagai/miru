      code_does: "ModelCapabilities dataclass (commit 68866b8) tem campo obrigatório capabilities"
      check_expects: "test_dataclass_creation/repr sem capabilities → TypeError"
      spec_says: "docstring: 'Model capabilities metadata'"
      resolution: "Testes atualizados: capabilities=[] adicionado (teste desatualizado, código é a verdade)"
    - id: "D-embed-timeout"
      code_does: "client.embed envia timeout=Timeout(30.0) (DEFAULT_TIMEOUT)"
      check_expects: "assert sem timeout"
      spec_says: "OllamaClient.DEFAULT_TIMEOUT = 30.0"
      resolution: "Assert atualizado para httpx.Timeout(30.0)"
    - id: "E-live-stream"
      code_does: "stream_as_markdown_live: se not isatty() → branch plain-text (nunca usa Live)"
      check_expects: "testes esperam live.update chamado N vezes (assumem TTY)"
      spec_says: "docstring: 'Real-time display'"
      resolution: "Testes mockam sys.stdout.isatty()=True (3 testes) para exercitar o branch Live — asserts intactos"
    - id: "F-input-image"
      code_does: "encode_image usa PIL para validar; bytes fake rejeitados pelo Pillow 12"
      check_expects: "testes esperam b64 válido"
      spec_says: "docstring: valida e codifica; ImageFormatError para formato não suportado"
      resolution: "Testes geram imagens REAIS com PIL (_make_image helper). large_image: imagem real + pad para 11MB (assert '11.0MB' PRESERVADO)"
    - id: "G-state-leak"
      code_does: "set_language global de módulo sem restauração"
      check_expects: "test_renderer passa isolado, falha no conjunto"
      spec_says: "i18n global é estado de módulo"
      resolution: "Fixture autouse em tests/conftest.py restaura get_language() após cada teste"
    - id: "H-asserts-desatualizados"
      code_does: "mensagens i18n vigentes (Falha ao conectar em..., Modelo copiado..., Visão, Forneça texto, Formato inválido)"
      check_expects: "asserts antigos pré-i18n (Cannot connect, Não foi possível conectar, Copiado, Suporte a imagens, Dimensions, Forneça um texto, Invalid format, miru list)"
      spec_says: "i18n adicionado em 92eed71 (depois dos testes, 021c712) — spec atual manda"
      resolution: "Asserts atualizados para as mensagens REAIS (mesma força: continuam verificando a mesma condição semântica — erro amigável, sucesso, formato)"
