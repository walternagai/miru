  resolution: "Conflitos resolvidos com ordem de autoridade: spec i18n (B/H) e comportamento real do código pós-commit 68866b8 (C/D/F) mandam sobre asserts antigos; bugs reais de código corrigidos (A); isolamento de teste adicionado (G). NENHUM assert relaxado — todos mantêm a mesma condição semântica."
